<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MattYbarA Community | Official Donation Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @keyframes blockchainPulse {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }
        .blockchain-bg { background: linear-gradient(-45deg, #020617, #0284c7, #1e1b4b, #dc2626, #090d16); background-size: 400% 400%; animation: blockchainPulse 12s ease infinite; }
        
        /* QR Code bianco su sfondo trasparente */
        .qr-wrapper img { margin: 0 auto; padding: 5px; background: white; border-radius: 8px; }
        
        /* Logo iniziale */
        .logo-auth { mix-blend-mode: screen; }

        /* SOLUZIONE DEFINITIVA: Inverte i colori e rimuove lo sfondo nero/bianco con lo screen blend pulito */
        .clean-img { filter: invert(1); mix-blend-mode: screen; }
    </style>
</head>
<body class="blockchain-bg text-slate-100 font-sans antialiased py-10 px-4 min-h-screen">

    <div class="max-w-md mx-auto space-y-8">
        <div class="text-center space-y-4">
            <img src="logo-autenticita.png" alt="Logo" class="w-32 h-32 mx-auto logo-auth drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]">
            <h1 class="text-2xl font-black text-white tracking-tight">Supporta il progetto futuristico! ⚡</h1>
            <p class="text-sm text-cyan-200/90 font-medium leading-relaxed">Scegli la crypto e la rete corretta. Zero intermediari, totale trasparenza on-chain.</p>
        </div>

        <!-- Tasto Principale Fluorescente - MattYbarA WebSite -->
        <div>
            <a href="https://mattybara.s.gy/lwkhuz" target="_blank" class="flex items-center justify-center gap-3 w-full py-4 px-6 text-base font-black tracking-wider uppercase text-slate-950 bg-cyan-300 hover:bg-cyan-200 rounded-2xl shadow-[0_0_30px_rgba(6,182,212,0.8)] border-2 border-cyan-100 transition-all transform hover:scale-[1.02]">
                🌐 MattYbarA WebSite ⚡
            </a>
        </div>

        <div id="crypto-list" class="space-y-6"></div>

        <div class="bg-slate-900/95 border border-cyan-500/30 rounded-2xl p-6 shadow-2xl">
            <h4 class="text-center font-bold text-slate-300 mb-6 uppercase tracking-widest text-sm">Canali Social</h4>
            <div id="social-container" class="space-y-4"></div>
        </div>

        <div class="text-center pt-8 space-y-6">
            <img src="signature.png" alt="Firma" class="w-full max-w-lg mx-auto clean-img">
            
            <div class="border-t border-cyan-500/20 pt-6 space-y-4">
                <p class="text-xs text-slate-500">MattYbarA Community © 2026 — Tutti i diritti riservati.</p>
                <div class="bg-black/40 p-4 rounded-lg border border-red-900/30">
                    <p class="text-[10px] text-red-400 font-bold uppercase tracking-wide mb-2">Verifica il dominio:</p>
                    <p class="text-cyan-400 font-mono text-xs break-all">mattybara-support696.github.io/Donation-Community-Page/</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CRYPTO_DATA = [
            { id: 'btc', name: 'Bitcoin (BTC)', address: 'bc1qmwrktrjdg4u2fql4nllenhnjn2fg7v3g794agn', icon: 'btc.png', btn1Text: 'Ledger', btn1Url: 'https://mattybara.s.gy/mMz8DP', btn2Text: 'Base', btn2Url: 'https://mattybara.s.gy/uaf9vf' },
            { id: 'eth', name: 'Ethereum (ETH)', address: '0xCEcDA843f36ED21D73CaB75ACbD93742652070a2', icon: 'eth.png', btn1Text: 'Ledger', btn1Url: 'https://mattybara.s.gy/mMz8DP', btn2Text: 'Rabby', btn2Url: 'https://mattybara.s.gy/yPAzFs' },
            { id: 'sol', name: 'Solana (SOL)', address: '8FBuZyxgcPKxkeruouQ9nYPCPsFS6rVuHoF31ipRCW2z', icon: 'sol.png', btn1Text: 'Ledger', btn1Url: 'https://mattybara.s.gy/mMz8DP', btn2Text: 'Phantom', btn2Url: 'https://mattybara.s.gy/bNgxxA' },
            { id: 'trx', name: 'Tron (TRX)', address: 'TFuihedg61D7SQhq9Uo7fc6eZZWKT9z42c', icon: 'trx.png', btn1Text: 'Ledger', btn1Url: 'https://mattybara.s.gy/mMz8DP', btn2Text: 'TronLink', btn2Url: 'https://mattybara.s.gy/gxhSYI' },
            { id: 'usdt', name: 'Tether (USDT)', address: 'TFuihedg61D7SQhq9Uo7fc6eZZWKT9z42c', icon: 'usdt.png', btn1Text: 'Ledger', btn1Url: 'https://mattybara.s.gy/mMz8DP', btn2Text: 'Exodus', btn2Url: 'https://mattybara.s.gy/k7lAlI' },
            { id: 'usdc', name: 'USDC', address: 'TFuihedg61D7SQhq9Uo7fc6eZZWKT9z42c', icon: 'usdc.png', btn1Text: 'Ledger', btn1Url: 'https://mattybara.s.gy/mMz8DP', btn2Text: 'Trust', btn2Url: 'https://mattybara.s.gy/K5TtYC' },
            { id: 'xaut', name: 'Tether Gold (XAUT)', address: '0xCEcDA843f36ED21D73CaB75ACbD93742652070a2', icon: 'xaut.png', btn1Text: 'Ledger', btn1Url: 'https://mattybara.s.gy/mMz8DP', btn2Text: 'MetaMask', btn2Url: 'https://mattybara.s.gy/Ml69zd' }
        ];

        const SOCIAL_DATA = [
            { name: 'Telegram', url: 'https://mattybara.s.gy/DW44dl', icon: 'telegram.png' },
            { name: 'Instagram', url: 'https://mattybara.s.gy/Lsp5wp', icon: 'instagram.png' },
            { name: 'X', url: 'https://mattybara.s.gy/WENuyy', icon: 'x.png' },
            { name: 'Youtube', url: 'https://mattybara.s.gy/u5gLdU', icon: 'youtube.png' },
            { name: 'Spotify', url: 'https://mattybara.s.gy/N9bDtE', icon: 'spotify.png' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('crypto-list');
            CRYPTO_DATA.forEach(c => {
                const div = document.createElement('div');
                div.className = "bg-slate-900/95 p-5 rounded-2xl border border-cyan-500/30 shadow-xl";
                div.innerHTML = `
                    <div class="flex items-center gap-3 mb-4">
                        <img src="${c.icon}" class="w-8 h-8 object-contain clean-img" alt="${c.name}">
                        <span class="font-bold text-lg text-white">${c.name}</span>
                    </div>
                    <div id="qr-${c.id}" class="qr-wrapper mb-4"></div>
                    <div class="flex flex-col gap-3">
                        <div class="flex items-center bg-black/50 p-3 rounded-lg border border-slate-700">
                            <span id="addr-${c.id}" class="text-sm font-mono break-all mr-2 flex-1">${c.address}</span>
                            <button onclick="copiaTesto('addr-${c.id}', this)" class="bg-cyan-700 px-3 py-1 text-xs rounded font-bold hover:bg-cyan-600 transition shrink-0">Copia 📋</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <a href="${c.btn1Url}" target="_blank" class="text-center bg-cyan-700/80 hover:bg-cyan-600 transition p-2 rounded-lg text-xs font-bold uppercase tracking-wider block">${c.btn1Text}</a>
                            <a href="${c.btn2Url}" target="_blank" class="text-center bg-red-700/80 hover:bg-red-600 transition p-2 rounded-lg text-xs font-bold uppercase tracking-wider block">${c.btn2Text}</a>
                        </div>
                    </div>
                `;
                container.appendChild(div);
                new QRCode(document.getElementById(`qr-${c.id}`), { text: c.address, width: 128, height: 128 });
            });

            const socCont = document.getElementById('social-container');
            socCont.innerHTML = `
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <a href="${SOCIAL_DATA[0].url}" target="_blank" class="flex items-center justify-center gap-2 bg-slate-800 p-3 rounded-xl border border-slate-700 hover:border-cyan-500 transition text-xs"><img src="${SOCIAL_DATA[0].icon}" class="w-5 h-5 object-contain clean-img"> ${SOCIAL_DATA[0].name}</a>
                    <a href="${SOCIAL_DATA[1].url}" target="_blank" class="flex items-center justify-center gap-2 bg-slate-800 p-3 rounded-xl border border-slate-700 hover:border-cyan-500 transition text-xs"><img src="${SOCIAL_DATA[1].icon}" class="w-5 h-5 object-contain clean-img"> ${SOCIAL_DATA[1].name}</a>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <a href="${SOCIAL_DATA[2].url}" target="_blank" class="flex items-center justify-center gap-2 bg-slate-800 p-3 rounded-xl border border-slate-700 hover:border-cyan-500 transition text-xs"><img src="${SOCIAL_DATA[2].icon}" class="w-5 h-5 object-contain clean-img"> ${SOCIAL_DATA[2].name}</a>
                    <a href="${SOCIAL_DATA[3].url}" target="_blank" class="flex items-center justify-center gap-2 bg-slate-800 p-3 rounded-xl border border-slate-700 hover:border-cyan-500 transition text-xs"><img src="${SOCIAL_DATA[3].icon}" class="w-5 h-5 object-contain clean-img"> ${SOCIAL_DATA[3].name}</a>
                </div>
                <div class="flex justify-center">
                    <a href="${SOCIAL_DATA[4].url}" target="_blank" class="flex items-center justify-center gap-2 bg-slate-800 p-3 rounded-xl border border-slate-700 hover:border-cyan-500 transition w-full text-xs"><img src="${SOCIAL_DATA[4].icon}" class="w-5 h-5 object-contain clean-img"> ${SOCIAL_DATA[4].name}</a>
                </div>
            `;
        });

        function copiaTesto(id, btn) {
            const txt = document.getElementById(id).innerText;
            navigator.clipboard.writeText(txt);
            btn.innerText = "Copiato! ✅";
            setTimeout(() => btn.innerText = "Copia 📋", 2000);
        }
    </script>
</body>
</html>
